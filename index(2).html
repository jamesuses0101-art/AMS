<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMS - Academy Management System</title>
  <link rel="stylesheet" href="style.css">
  <!-- SheetJS for Excel import/export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Page Loader -->
  <div class="page-loader" id="page-loader">
    <div class="spinner"></div>
  </div>

  <!-- Load all JS parts -->
  <script src="ams_part1_core.js"></script>
  <script src="ams_part2_auth.js"></script>
  <script src="ams_part3_nav_onboarding.js"></script>
  <script src="ams_part4_pages.js"></script>
  <script src="ams_part5_reports_settings_import.js"></script>
  <script src="ams_part6_modals.js"></script>

  <script>
    // ==================================================
    // APP INITIALIZATION
    // ==================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize state from localStorage
      State.init();

      // Check for existing session
      if (State.isLoggedIn()) {
        if (!State.currentAcademy?.onboardingComplete) {
          Router.navigate('onboarding');
        } else {
          Router.navigate('dashboard');
        }
      } else {
        Router.navigate('login');
      }

      // Initialize toast container
      Toast.init();

      console.log('AMS initialized. Version:', CONFIG.VERSION);
    });
  </script>
</body>
</html>
